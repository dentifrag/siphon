name: Release binaries

# Build single-file executables for Windows, macOS, and Linux and attach them to
# a GitHub Release whenever a version tag (e.g. v1.0.0) is pushed. You can also
# run it manually from the Actions tab to get downloadable artifacts.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            artifact: siphon-win-x64.exe
          - os: ubuntu-latest
            script: package:linux
            artifact: siphon-linux-x64
          - os: macos-latest
            script: package:macos-arm64
            artifact: siphon-macos-arm64
          - os: macos-latest
            script: package:macos-x64
            artifact: siphon-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require release tag and package version agreement
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node -e "const ref=process.env.RELEASE_REF;if(ref.startsWith('refs/tags/')){const tag=ref.slice(10);const version=tag.replace(/^v/,'');if(!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)||version!==require('./package.json').version){throw new Error('Stable release tag must match package.json version')}}"

      - name: Install dependencies
        run: npm ci

      - name: Build web UI + server bundle
        run: npm run package:build

      - name: Package executable
        run: npm run ${{ matrix.script }}

      - name: Generate pinned Windows update metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $asset = Get-Item .\dist-bin\siphon-win-x64.exe
          $sha256 = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Content .\package.json -Raw | ConvertFrom-Json).version
          $manifest = [ordered]@{ protocolVersion = 1; version = $version; assetName = $asset.Name; sizeBytes = $asset.Length; sha256 = $sha256 }
          $manifest | ConvertTo-Json | Set-Content .\dist-bin\siphon-win-x64.update.json -Encoding utf8
          "$sha256  $($asset.Name)" | Set-Content .\dist-bin\SHA256SUMS -Encoding utf8

      - name: Upload Windows update metadata
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-update-metadata
          path: |
            dist-bin/siphon-win-x64.update.json
            dist-bin/SHA256SUMS
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-bin/${{ matrix.artifact }}
          fail_on_unmatched_files: true

      - name: Attach Windows update metadata to release
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-bin/siphon-win-x64.update.json
            dist-bin/SHA256SUMS
          fail_on_unmatched_files: true
