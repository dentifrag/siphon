name: CI

# Runs type checking, linting, formatting checks, tests, and a production build
# on every push to main and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-updater:
    name: Safe Windows updater core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify injected updater operations with Windows PowerShell
        shell: powershell
        run: |
          & .\test\fixtures\WindowsUpdater.Tests.ps1 -CorePath (Resolve-Path .\windows-service\SiphonUpdater.Core.ps1).Path
      - name: Verify installer preflight without service or task operations
        shell: powershell
        run: |
          & .\test\fixtures\WindowsInstallerPreflight.Tests.ps1 -WorkerPath (Resolve-Path .\windows-service\Update-SiphonService.ps1).Path -Scenario bind
      - name: Verify existing service-path ACLs without host mutations
        shell: powershell
        run: |
          & .\test\fixtures\WindowsInstallerPreflight.Tests.ps1 -WorkerPath (Resolve-Path .\windows-service\Update-SiphonService.ps1).Path -Scenario acl

  check:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
