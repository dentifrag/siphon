services:
  siphon:
    build: .
    image: siphon
    container_name: siphon
    ports:
      - "8080:8080"
    environment:
      # Set a password to protect the UI (recommended). Leave empty for open LAN use.
      APP_PASSWORD: "${APP_PASSWORD:-}"
      # Download destinations shown in the folder picker. Format:
      #   "Label=/container/path,Other=/container/path2"
      # Each path must be mounted below. Point these at your drives.
      DOWNLOAD_DIRS: "Downloads=/downloads"
    volumes:
      # Saved connection profiles + the rclone config (which holds SFTP secrets).
      - ./data:/data
      # Default single download location.
      - ./downloads:/downloads
      # --- Multiple drives ---------------------------------------------------
      # Mount each drive you want to save to, then list them in DOWNLOAD_DIRS.
      # Example (Linux host):
      #   - /mnt/movies:/drives/movies
      #   - /mnt/backup:/drives/backup
      # and set: DOWNLOAD_DIRS: "Movies=/drives/movies,Backup=/drives/backup"
      #
      # --- Browse the whole host filesystem ---------------------------------
      # On a LINUX host you can mount everything at native speed:
      #   - /:/host
      # and set: DOWNLOAD_DIRS: "Host=/host"
      # (Broad access: only do this on a trusted box, ideally with APP_PASSWORD set.)
      # On Docker Desktop (Windows/Mac) the host FS is bridged through a VM, so
      # paths are remapped and slower; for full-speed whole-disk access on those
      # machines, run the server natively instead (see README).
    restart: unless-stopped
